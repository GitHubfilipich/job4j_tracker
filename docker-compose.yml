version: "3.9"
services:
  db:
    image: postgres
    container_name: db
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=postgres
      - POSTGRES_DB=tracker
      - PGDATA=/pgdata
    volumes:
      - ./db/shortcut/data:/pgdata
    restart: always
  liquibase:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    environment:
      - JDBC_URL=jdbc:postgresql://db:5432/tracker
      - JDBC_USERNAME=postgres
      - JDBC_PASSWORD=password
      - JDBC_DRIVER=org.postgresql.Driver
    depends_on:
      - db
    command: mvn liquibase:update -Pdocker
    restart: "no"
  job4j_tracker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - JDBC_URL=jdbc:postgresql://db:5432/tracker
      - JDBC_USERNAME=postgres
      - JDBC_PASSWORD=password
      - JDBC_DRIVER=org.postgresql.Driver
    container_name: job4j_tracker
    depends_on:
      - db